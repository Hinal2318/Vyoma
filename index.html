    <title>Vyoma Learning Systems | Building the Future of Learning</title>
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="/images/logos/vyoma.png" />
    <link rel="apple-touch-icon" href="/images/logos/vyoma.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              offwhite: '#F9FAFC',
              deepBlue: '#1E3A8A',
              skyBlue: '#3B82F6',
              softOrange: '#F97316',
              mutedSlate: '#64748B',
              darkNavy: '#0F172A',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Poppins', 'Sora', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: #F9FAFC;
        overflow-x: hidden;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .bg-grid {
        background-image: radial-gradient(circle, #3B82F6 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.05;
      }
    </style>
